<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BarKit · 條碼產生器</title>
<script src="js/theme.js"></script>
<link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
<script src="vendor/jsbarcode/JsBarcode.all.min.js"></script>
<script src="vendor/qrcode-generator/qrcode.min.js"></script>
<script src="vendor/jszip/jszip.min.js"></script>
<script src="fonts/ocrb.js"></script>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/theme.css">
</head>
<body class="bg-body-tertiary">
<div class="container py-3 py-lg-4 d-print-none">
  <div class="mb-3 d-flex align-items-center justify-content-between">
    <!-- Brand mark (decorative; the page title for screen readers is the h1 below) -->
    <div class="bk-brand" aria-hidden="true"><span class="bk-bars"></span>BarKit<span class="bk-tag">TOOLBOX</span></div>
    <div class="btn-group btn-group-sm" role="group" aria-label="日夜模式">
      <input type="radio" class="btn-check" name="theme" id="themeLight">
      <label class="tip btn btn-outline-secondary" for="themeLight" title="日間模式" aria-label="日間模式"><i class="bi bi-sun"></i></label>
      <input type="radio" class="btn-check" name="theme" id="themeDark">
      <label class="tip btn btn-outline-secondary" for="themeDark" title="夜間模式" aria-label="夜間模式"><i class="bi bi-moon-stars"></i></label>
    </div>
  </div>
  <div class="row g-3">
    <!-- Content & settings: first in the page (Tab order), left on desktop -->
    <div class="col-lg-4 order-2 order-lg-1">
      <div class="d-flex flex-column gap-3">
      <section class="card bk-module" data-tag="INPUT 01"><div class="card-body">
        <h2 class="h6 fw-semibold mb-3">條碼內容</h2>
        <div class="mb-3">
          <select id="format" class="form-select" aria-label="條碼格式">
            <optgroup label="通用">
              <option value="CODE128" selected>CODE128</option>
              <option value="CODE39">CODE39</option>
            </optgroup>
            <optgroup label="零售商品">
              <option value="EAN13">EAN-13</option>
              <option value="EAN8">EAN-8</option>
              <option value="UPC">UPC-A</option>
            </optgroup>
            <optgroup label="物流外箱">
              <option value="ITF14">ITF-14</option>
            </optgroup>
            <optgroup label="二維條碼">
              <option value="QR">QR Code</option>
            </optgroup>
          </select>
          <div class="form-text" id="formatHint"></div>
        </div>

        <div class="d-flex gap-2 mb-2">
          <div class="btn-group flex-grow-1" role="group" aria-label="輸入方式">
            <input type="radio" class="btn-check" name="mode" id="modeText" checked>
            <label class="btn btn-sm btn-outline-primary" for="modeText">自訂內容</label>
            <input type="radio" class="btn-check" name="mode" id="modeBatch">
            <label class="btn btn-sm btn-outline-primary" for="modeBatch">批量產生</label>
          </div>
          <button id="clear" type="button" class="tip btn btn-sm btn-outline-secondary btn-clear" data-bs-toggle="modal" data-bs-target="#clearModal" title="清空內容" aria-label="清空內容"><i class="bi bi-trash"></i></button>
        </div>

        <div id="paneText">
          <textarea id="value" class="form-control" rows="4" placeholder="輸入條碼內容" aria-label="內容"></textarea>
          <div id="lineErr" class="small text-danger-emphasis mt-1" hidden>
            <div class="d-flex align-items-center justify-content-end gap-2">
              <i class="bi bi-exclamation-circle" aria-hidden="true"></i>
              <span id="lineErrText"></span>
              <button id="lineErrGo" type="button" class="btn btn-sm btn-outline-danger text-nowrap py-0">前往<i class="bi bi-arrow-right ms-1"></i></button>
            </div>
          </div>
          <div class="d-flex align-items-center mt-2">
            <div class="form-check mb-0">
              <input id="multiLine" class="form-check-input" type="checkbox" checked>
              <label for="multiLine" class="form-check-label">每行一筆</label>
            </div>
            <span id="lineCount" class="ms-auto small text-body-secondary"></span>
          </div>
        </div>

        <div id="paneBatch" hidden>
          <div class="row g-2">
            <div class="col-6"><div class="input-group"><label for="bPrefix" class="input-group-text opt-label">前綴</label><input id="bPrefix" class="form-control px-2" placeholder="如 ABC-"></div></div>
            <div class="col-6"><div class="input-group"><label for="bSuffix" class="input-group-text opt-label">後綴</label><input id="bSuffix" class="form-control px-2" placeholder="選填"></div></div>
            <div class="col-12">
              <div class="input-group">
                <label for="bStart" class="input-group-text opt-label">起</label><input id="bStart" class="form-control px-2" inputmode="numeric" placeholder="如 01">
                <label for="bEnd" class="input-group-text opt-label">迄</label><input id="bEnd" class="form-control px-2" inputmode="numeric" placeholder="如 50">
                <label for="bStep" class="input-group-text opt-label">增量</label><input id="bStep" class="form-control px-2" inputmode="numeric" placeholder="1">
              </div>
            </div>
          </div>
          <div id="bPreview" class="d-flex align-items-center gap-2 mt-2 small"></div>
        </div>
      </div></section>

      <section class="card bk-module" data-tag="STYLE 02"><div class="card-body">
        <div class="d-flex align-items-center justify-content-between mb-3">
          <h2 class="h6 fw-semibold mb-0">顯示選項</h2>
          <button id="resetDisplay" type="button" class="tip btn btn-sm btn-outline-secondary" title="恢復預設" aria-label="恢復預設"><i class="bi bi-arrow-counterclockwise"></i></button>
        </div>

        <div class="only-1d">
          <div class="small fw-semibold text-body-secondary mb-2">條碼外觀</div>
          <!-- Label sits inside each field (prefix), so every option takes one line -->
          <div class="row g-2">
            <div class="col-6"><div class="input-group"><label for="barWidth" class="input-group-text opt-label">線寬</label><input id="barWidth" class="form-control px-2" type="number" min="1" max="6" value="2"><span class="input-group-text px-2">px</span></div></div>
            <div class="col-6"><div class="input-group"><label for="height" class="input-group-text opt-label">高度</label><input id="height" class="form-control px-2" type="number" min="10" max="300" value="100"><span class="input-group-text px-2">px</span></div></div>
            <div class="col-6"><div class="input-group"><label for="marginY" class="input-group-text opt-label">上下邊距</label><input id="marginY" class="form-control px-2" type="number" min="0" max="100" value="10"><span class="input-group-text px-2">px</span></div></div>
            <div class="col-6"><div class="input-group"><label for="marginX" class="input-group-text opt-label">左右邊距</label><input id="marginX" class="form-control px-2" type="number" min="0" max="100" value="10"><span class="input-group-text px-2">px</span></div></div>
          </div>
          <div class="small fw-semibold text-body-secondary mt-3 mb-2">文字</div>
          <div class="row g-2">
            <div class="col-6">
              <div class="input-group">
                <label for="font" class="input-group-text opt-label">字體</label>
                <select id="font" class="form-select px-2">
                  <option value="monospace" selected>等寬</option>
                  <option value="sans-serif">無襯線</option>
                  <option value="OCR-B">OCR-B</option>
                </select>
              </div>
              <div class="form-text" id="fontHint" hidden>GS1 商品條碼標準字型</div>
            </div>
            <div class="col-6"><div class="input-group"><label for="fontSize" class="input-group-text opt-label">字級</label><input id="fontSize" class="form-control px-2" type="number" min="8" max="48" value="20"><span class="input-group-text px-2">px</span></div></div>
          </div>
        </div>

        <div class="only-qr" hidden>
          <div class="small fw-semibold text-body-secondary mb-2">條碼外觀</div>
          <div class="row g-2">
            <div class="col-6">
              <div class="input-group">
                <label for="ecLevel" class="input-group-text opt-label">容錯</label>
                <select id="ecLevel" class="form-select px-2">
                  <option value="L">L 7%</option>
                  <option value="M" selected>M 15%</option>
                  <option value="Q">Q 25%</option>
                  <option value="H">H 30%</option>
                </select>
              </div>
            </div>
            <div class="col-6"><div class="input-group"><label for="cellSize" class="input-group-text opt-label">模組</label><input id="cellSize" class="form-control px-2" type="number" min="1" max="20" value="8"><span class="input-group-text px-2">px</span></div></div>
            <div class="col-6"><div class="input-group"><label for="qrMargin" class="input-group-text opt-label">邊距</label><input id="qrMargin" class="form-control px-2" type="number" min="0" max="10" value="4"><span class="input-group-text px-2">格</span></div></div>
          </div>
        </div>

        <div class="small fw-semibold text-body-secondary mt-3 mb-2">顏色</div>
        <div class="row g-2">
          <div class="col-6"><div class="input-group"><label for="lineColor" class="input-group-text opt-label">條碼</label><input id="lineColor" class="form-control form-control-color color-swatch" type="color" value="#000000"><input id="lineColorHex" class="form-control px-1 text-center tabular" maxlength="7" aria-label="條碼顏色色碼"></div></div>
          <div class="col-6"><div class="input-group"><label for="background" class="input-group-text opt-label">背景</label><input id="background" class="form-control form-control-color color-swatch" type="color" value="#ffffff"><input id="backgroundHex" class="form-control px-1 text-center tabular" maxlength="7" aria-label="背景顏色色碼"></div></div>
        </div>
        <div class="form-check mt-2">
          <input id="transparent" class="form-check-input" type="checkbox">
          <label for="transparent" class="form-check-label">透明背景</label>
        </div>

        <div class="d-flex align-items-center gap-2 mt-3 mb-2">
          <span class="small fw-semibold text-body-secondary me-auto">輸出尺寸</span>
          <select id="sizeUnit" class="form-select form-select-sm py-0 w-auto" aria-label="尺寸單位" title="px 為畫面像素，1 px = 1/96 英寸，與顯示選項同單位">
            <option value="mm">mm</option>
            <option value="px" selected>px</option>
          </select>
          <button id="gs1Btn" type="button" class="btn btn-sm btn-outline-primary py-0" title="套用 GS1 100% 標準尺寸，最細線寬 0.33 mm" hidden>GS1 標準</button>
          <button id="sizeClear" type="button" class="tip btn btn-sm btn-outline-secondary py-0" title="恢復預設尺寸" aria-label="恢復預設尺寸" hidden><i class="bi bi-arrow-counterclockwise"></i></button>
        </div>
        <div class="d-flex align-items-center gap-1">
          <div class="input-group flex-fill">
            <label for="imgW" class="input-group-text opt-label">寬</label>
            <input id="imgW" class="form-control px-2" type="number" min="1" step="0.1" aria-label="輸出寬度">
            <span class="input-group-text px-2 unit-label">px</span>
          </div>
          <i class="bi bi-link-45deg text-body-secondary" aria-hidden="true"></i>
          <div class="input-group flex-fill">
            <label for="imgH" class="input-group-text opt-label">高</label>
            <input id="imgH" class="form-control px-2" type="number" min="1" step="0.1" aria-label="輸出高度">
            <span class="input-group-text px-2 unit-label">px</span>
          </div>
        </div>
      </div></section>
      </div>
    </div>

    <!-- Preview & output: shown first on phones, right on desktop -->
    <div class="col-lg-8 order-1 order-lg-2">
      <div class="card preview-card bk-module" data-tag="OUTPUT 03"><div class="card-body d-flex flex-column gap-3">
        <h1 class="visually-hidden">條碼產生器</h1>
        <div id="topBar" class="d-flex align-items-center gap-2">
        <div id="viewBar" hidden>
          <div class="d-flex align-items-center gap-2">
          <div class="btn-group btn-group-sm" role="group" aria-label="預覽方式">
            <input type="radio" class="btn-check" name="view" id="viewOne" checked>
            <label class="tip btn btn-outline-secondary" for="viewOne" title="單筆預覽"><i class="bi bi-square"></i></label>
            <input type="radio" class="btn-check" name="view" id="viewAll">
            <label class="tip btn btn-outline-secondary" for="viewAll" title="全部預覽"><i class="bi bi-grid-3x3-gap"></i></label>
          </div>
          <span id="gridSummary" class="small text-body-secondary"></span>
          </div>
        </div>
        <!-- Other items with errors (desktop copy; phones have one under the preview) -->
        <div class="ms-auto d-none d-lg-block">
        <div class="other-err d-flex align-items-center gap-2 small text-danger-emphasis d-none">
          <i class="bi bi-exclamation-circle" aria-hidden="true"></i>
          <span class="other-err-text"></span>
          <button type="button" class="other-err-go btn btn-sm btn-outline-danger text-nowrap py-0">前往<i class="bi bi-arrow-right ms-1"></i></button>
        </div>
        </div>
        </div>
        <div id="previewArea" class="flex-grow-1 d-flex flex-column align-items-center justify-content-center gap-3">
          <div id="empty" class="text-center text-body-secondary">
            <i class="bi bi-upc-scan d-block mb-2 opacity-50 fs-1" aria-hidden="true"></i>
            <div class="small">輸入內容即可產生條碼</div>
          </div>
          <!-- Grid: ‹ | toolbar + canvas | › ; "n / N" under the canvas. The arrows span
               from the canvas top to the bottom of the "n / N" line (CSS only) -->
          <div id="previewBox" class="w-100">
            <button id="prev" class="btn btn-outline-secondary nav-side tip" title="上一筆" aria-label="上一筆"><i class="bi bi-chevron-left"></i></button>
          <div class="preview-main min-w-0">
            <div id="previewTools" class="d-flex gap-1">
              <div id="dlOneWrap" class="dropdown tip" title="下載此條碼" hidden>
                <button class="btn btn-sm btn-outline-secondary" type="button" data-bs-toggle="dropdown" aria-expanded="false" aria-label="下載此條碼"><i class="bi bi-file-earmark-arrow-down"></i></button>
                <ul class="dropdown-menu dropdown-menu-end">
                  <li><h6 class="dropdown-header">下載第 <span id="dlOneNum"></span> 筆條碼</h6></li>
                  <li><button id="dlOneSvg" type="button" class="dropdown-item d-flex align-items-center gap-2"><i class="bi bi-filetype-svg"></i>SVG 向量圖</button></li>
                  <li><button id="dlOnePng" type="button" class="dropdown-item d-flex align-items-center gap-2"><i class="bi bi-filetype-png"></i>PNG 圖片<span id="dlOneDpi" class="ms-auto small text-body-secondary"></span></button></li>
                </ul>
              </div>
              <button id="copyPng" class="tip btn btn-sm btn-outline-secondary" title="複製圖片" aria-label="複製圖片"><i class="bi bi-clipboard"></i></button>
              <button id="print" class="tip btn btn-sm btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#printModal" title="列印標籤" aria-label="列印標籤"><i class="bi bi-printer"></i></button>
            </div>
            <div id="canvasWrap" class="canvas-wrap rounded p-3"><svg id="out" xmlns="http://www.w3.org/2000/svg"></svg>
              <div class="err-box small text-center text-danger-emphasis" role="alert">
                <i class="bi bi-exclamation-triangle d-block mb-1 opacity-75 fs-3" aria-hidden="true"></i>
                <div id="error" class="fw-semibold"></div>
                <div id="errHint" class="opacity-75"></div>
                <div id="fixRow" class="mt-2" hidden>
                  <button id="fixBtn" type="button" class="btn btn-sm btn-danger"><i class="bi bi-eraser me-1"></i><span id="fixLabel"></span></button>
                </div>
              </div>
            </div>
          </div>
            <button id="next" class="btn btn-outline-secondary nav-side tip" title="下一筆" aria-label="下一筆"><i class="bi bi-chevron-right"></i></button>
            <div id="nav" class="invisible">
              <!-- One line: type a number to jump straight to that item -->
              <div class="d-flex align-items-center justify-content-center gap-1 small text-body-secondary">
                <input id="posInput" class="form-control form-control-sm text-center px-1" type="number" min="1" aria-label="跳到第幾筆">
                <span id="pos" aria-live="polite"></span>
              </div>
            </div>
          </div>
          <!-- Phones: the same notice at the bottom right; text, then the button below it -->
          <div class="d-lg-none w-100">
          <div class="other-err text-end small text-danger-emphasis d-none">
            <div><i class="bi bi-exclamation-circle me-2" aria-hidden="true"></i><span class="other-err-text"></span></div>
            <button type="button" class="other-err-go btn btn-sm btn-outline-danger text-nowrap py-0 mt-1">前往<i class="bi bi-arrow-right ms-1"></i></button>
          </div>
          </div>
          <div id="downloads" class="w-100">
          <div class="d-flex justify-content-center gap-2">
            <button id="dlSvg" class="dl-col btn btn-primary text-nowrap"><i class="bi bi-download me-1"></i><span class="lbl">SVG</span></button>
            <!-- PNG + its resolution in one control; #dpi stays as the saved value -->
            <div class="dl-col btn-group">
              <button id="dlPng" class="btn btn-outline-primary text-nowrap"><i class="bi bi-download me-1"></i><span class="lbl">PNG</span></button>
              <button type="button" class="dpi-btn btn btn-outline-primary dropdown-toggle text-nowrap flex-grow-0" data-bs-toggle="dropdown" aria-expanded="false" aria-label="PNG 解析度"><span class="dpi-label">300 DPI</span></button>
              <ul class="dpi-menu dropdown-menu dropdown-menu-end"></ul>
            </div>
            <select id="dpi" hidden aria-hidden="true" tabindex="-1">
              <option value="96">螢幕</option>
              <option value="203">標籤機</option>
              <option value="300" selected>印表機</option>
              <option value="600">高品質</option>
            </select>
          </div>
          <div id="zipProgress" class="mx-auto mt-2" hidden>
            <div class="d-flex justify-content-between small text-body-secondary mb-1"><span id="zipLabel">打包中</span><span id="zipCount"></span></div>
            <div class="progress" role="progressbar" aria-label="打包進度"><div id="zipBar" class="progress-bar"></div></div>
          </div>
          </div>
        </div>
        <div id="gridView" class="grid-view" hidden></div>
        <!-- Actions for the items picked in the whole-set view -->
        <div id="gridBar" class="d-flex flex-wrap align-items-center gap-2 small d-none">
          <button id="selAll" type="button" class="btn btn-outline-secondary text-nowrap">全選</button>
          <span id="selCount" class="text-body-secondary"></span>
          <div class="ms-auto d-flex gap-2">
            <button id="selSvg" type="button" class="btn btn-primary text-nowrap" disabled><i class="bi bi-download me-1"></i>SVG</button>
            <div class="btn-group">
              <button id="selPng" type="button" class="btn btn-outline-primary text-nowrap" disabled><i class="bi bi-download me-1"></i>PNG</button>
              <button type="button" class="dpi-btn btn btn-outline-primary dropdown-toggle text-nowrap" data-bs-toggle="dropdown" aria-expanded="false" aria-label="PNG 解析度"><span class="dpi-label">300 DPI</span></button>
              <ul class="dpi-menu dropdown-menu dropdown-menu-end"></ul>
            </div>
            <button id="selPrint" type="button" class="btn btn-outline-secondary text-nowrap" aria-label="列印標籤" disabled><i class="bi bi-printer me-sm-1"></i><span class="d-none d-sm-inline">列印</span></button>
          </div>
        </div>
      </div></div>
    </div>
  </div>
</div>
<div id="sheet"></div>

<div class="modal fade d-print-none" id="printModal" tabindex="-1" aria-labelledby="printModalTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content border-0 shadow rounded-4">
      <div class="modal-header border-0 pb-0">
        <h2 class="modal-title fs-5 fw-semibold d-flex align-items-center gap-2" id="printModalTitle"><i class="bi bi-printer text-primary" aria-hidden="true"></i>列印標籤</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="關閉"></button>
      </div>
      <div class="modal-body">
        <div class="row g-4">
          <!-- First page in miniature -->
          <div class="col-sm-5">
            <div class="h-100 bg-body-tertiary rounded-3 p-3 d-flex flex-column align-items-center justify-content-center gap-3">
              <div class="sheet-preview position-relative overflow-hidden bg-white border shadow-sm" aria-label="第一頁版面預覽"><div id="sheetPreview" class="sheet-preview-grid"></div></div>
              <div class="small text-body-secondary text-center" id="printInfo"></div>
            </div>
          </div>
          <div class="col-sm-7">
            <div class="small fw-semibold text-body-secondary mb-2">標籤紙</div>
            <div class="d-flex flex-column gap-2 mb-4">
              <div class="input-group">
                <label for="printLayout" class="input-group-text opt-label">版型</label>
                <select id="printLayout" class="form-select px-2">
                  <option value="3x8" selected>A4 3 × 8</option>
                  <option value="2x7">A4 2 × 7</option>
                  <option value="3x10">A4 3 × 10</option>
                  <option value="4x10">A4 4 × 10</option>
                  <option value="custom">自訂</option>
                </select>
              </div>
              <div class="input-group" id="printCustom" hidden>
                <label for="printCols" class="input-group-text opt-label">欄</label>
                <input id="printCols" class="form-control px-2" type="number" min="1" max="8" value="3">
                <label for="printRows" class="input-group-text opt-label">列</label>
                <input id="printRows" class="form-control px-2" type="number" min="1" max="30" value="8">
              </div>
              <div class="input-group">
                <label for="printStart" class="input-group-text opt-label">從第</label>
                <input id="printStart" class="form-control px-2" type="number" min="1" value="1" aria-label="從第幾格開始">
                <span class="input-group-text opt-label">格開始</span>
              </div>
            </div>
            <div class="small fw-semibold text-body-secondary mb-2">條碼</div>
            <div class="input-group mb-4">
              <label for="printFrom" class="input-group-text opt-label">從第</label>
              <input id="printFrom" class="form-control px-2" type="number" min="1" value="1" aria-label="從第幾筆開始印">
              <span class="input-group-text opt-label">筆開始</span>
            </div>
            <div class="small fw-semibold text-body-secondary mb-2">位置微調</div>
            <div class="row g-2">
              <div class="col-6">
                <div class="input-group">
                  <span class="input-group-text opt-label">往右</span>
                  <input id="printOffX" class="form-control px-2" type="number" step="0.5" value="0" aria-label="往右偏移 mm">
                  <span class="input-group-text opt-label">mm</span>
                </div>
              </div>
              <div class="col-6">
                <div class="input-group">
                  <span class="input-group-text opt-label">往下</span>
                  <input id="printOffY" class="form-control px-2" type="number" step="0.5" value="0" aria-label="往下偏移 mm">
                  <span class="input-group-text opt-label">mm</span>
                </div>
              </div>
            </div>
            <div class="form-text">印出來對不準標籤紙時調整，負數代表往左、往上。列印對話框的邊界請選「無」。</div>
          </div>
        </div>
      </div>
      <div class="modal-footer border-0 pt-0">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button>
        <button type="button" id="printConfirm" class="btn btn-primary px-4"><i class="bi bi-printer me-1" aria-hidden="true"></i>列印</button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade d-print-none" id="clearModal" tabindex="-1" aria-labelledby="clearModalTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content border-0 shadow rounded-4">
      <div class="modal-body text-center p-4 pb-3">
        <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-danger-subtle text-danger fs-4 mb-3 clear-icon"><i class="bi bi-trash" aria-hidden="true"></i></div>
        <h2 class="fs-5 fw-semibold mb-1" id="clearModalTitle">清空內容</h2>
        <p class="small text-body-secondary mb-0">確定要清空所有條碼內容嗎？</p>
      </div>
      <div class="modal-footer border-0 pt-0 px-4 pb-4 flex-nowrap gap-2">
        <button type="button" class="btn btn-outline-secondary flex-fill m-0" data-bs-dismiss="modal">取消</button>
        <button type="button" id="clearConfirm" class="btn btn-danger flex-fill m-0" data-bs-dismiss="modal">清空</button>
      </div>
    </div>
  </div>
</div>
<div id="srStatus" class="visually-hidden" role="status" aria-live="polite"></div>
